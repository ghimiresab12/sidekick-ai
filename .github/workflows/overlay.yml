name: Overlay
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            overlay/package-lock.json
      # The overlay type-checks and tests against the shared modules in ../src.
      - run: npm ci
      - run: npm ci --prefix overlay
      - run: npm --prefix overlay run typecheck
      - run: npm --prefix overlay test
      - run: npm --prefix overlay run build
