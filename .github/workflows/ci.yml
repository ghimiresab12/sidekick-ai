name: Agent CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node-checks:
    name: Node, reasoning, and overlay checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            overlay/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node --test tests/reasoning/*.test.mjs
      - run: node --test tests/local-service.test.mjs
      - run: node --check scripts/sidekick-local-server.mjs && node --check scripts/dev-app.mjs
      - run: npm ci --prefix overlay
      - run: npm --prefix overlay run typecheck
      - run: npm --prefix overlay test
      - run: npm --prefix overlay run build

  python-checks:
    name: Python checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        working-directory: agent

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: agent/pyproject.toml
      - run: uv sync
      - run: uv run ruff format --check src tests
      - run: uv run ruff check src tests
      - run: uv run pytest

  docker-build:
    name: Build agent image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./agent
          push: false
          tags: sidekick-ai-agent:ci
